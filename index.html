<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Aplomo: medidas de fabricación, vidrio, persiana, materiales y presupuesto en PDF para montadores de ventanas, puertas y mamparas.">
<meta name="theme-color" content="#0D6E63">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Aplomo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  html,body{margin:0}
  body{font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#F7F7F5}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
</head>
<body>
<style>
/* Layout: hoja de taller — barra de obra fija arriba, pestañas desplazables, bloques apilados en una columna, resultado fijo abajo */
:root{
  --bg:#F2F4F2; --surface:#FFFFFF; --surface-2:#E7EBE8; --surface-3:#DCE2DE;
  --line:#CFD6D1; --line-2:#B6C0B9;
  --ink:#141918; --ink-2:#56615C; --ink-3:#7C8781;
  --accent:#0D6E63; --accent-2:#0A574E; --on-accent:#FFFFFF;
  --warn:#9A5A12; --warn-bg:#FBEEDC;
  --danger:#9E2B20; --danger-bg:#FAE6E3;
  --ok:#2C6B3A; --ok-bg:#E2F0E4;
  --blue:#2A5D80;
  --f-disp:'Archivo','Helvetica Neue',Arial,sans-serif;
  --f-body:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
  --f-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  --r:10px; --sh:0 1px 2px rgba(20,25,24,.07), 0 6px 18px rgba(20,25,24,.05);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#101413; --surface:#181E1C; --surface-2:#1F2624; --surface-3:#28302D;
  --line:#2E3733; --line-2:#3E4945;
  --ink:#EAEFEC; --ink-2:#A3AEA9; --ink-3:#7F8A85;
  --accent:#36A596; --accent-2:#4CBFAF; --on-accent:#06201C;
  --warn:#E0A95F; --warn-bg:#32270F;
  --danger:#F08C80; --danger-bg:#361714;
  --ok:#78C98A; --ok-bg:#132A18;
  --blue:#79B4DC;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101413; --surface:#181E1C; --surface-2:#1F2624; --surface-3:#28302D;
  --line:#2E3733; --line-2:#3E4945;
  --ink:#EAEFEC; --ink-2:#A3AEA9; --ink-3:#7F8A85;
  --accent:#36A596; --accent-2:#4CBFAF; --on-accent:#06201C;
  --warn:#E0A95F; --warn-bg:#32270F;
  --danger:#F08C80; --danger-bg:#361714;
  --ok:#78C98A; --ok-bg:#132A18;
  --blue:#79B4DC;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--f-disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---- barra superior ---- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{padding:10px 16px 8px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.mark{width:26px;height:26px;flex:none;border:2px solid var(--accent);border-radius:3px;position:relative}
.mark::after{content:"";position:absolute;inset:4px;border-top:2px solid var(--accent);border-right:2px solid var(--accent);transform:rotate(0deg)}
.brand b{font-family:var(--f-disp);font-size:15px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.top-act{margin-left:auto;display:flex;gap:6px}
.iconbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;font-size:14px}
.iconbtn:hover{border-color:var(--line-2)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;background:transparent;border:1px solid var(--line);color:var(--ink-2);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.tab .n{font-family:var(--f-mono);opacity:.7;margin-left:5px;font-size:11px}

/* ---- contenido ---- */
main{padding:14px 16px 150px;max-width:860px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card.flat{background:transparent;border:none;padding:0}
.card > h3{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card > h3::after{content:"";flex:1;height:1px;background:var(--line)}
.sect-title{font-size:20px;font-weight:700;margin-bottom:3px}
.sect-sub{color:var(--ink-2);font-size:13px;margin-bottom:14px}

.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){ .g3{grid-template-columns:repeat(2,minmax(0,1fr))} }
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.f input,.f select,.f textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.f input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.f .hint{font-size:11px;color:var(--ink-3)}
.f.inline{flex-direction:row;align-items:center;gap:9px}
.chk{display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.chk.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}

.btn{background:var(--accent);color:var(--on-accent);border:1px solid var(--accent);border-radius:9px;padding:10px 14px;font-weight:600;font-size:14px;cursor:pointer}
.btn:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.sec{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
.btn.sec:hover{background:var(--surface-3);border-color:var(--line-2)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.danger{background:transparent;color:var(--danger);border-color:var(--line)}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* ---- lista de huecos ---- */
.hueco{display:flex;gap:11px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-bottom:8px;cursor:pointer;text-align:left;width:100%}
.hueco:hover{border-color:var(--line-2)}
.hueco.sel{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.hueco .ix{font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--ink-3);width:24px;flex:none}
.hueco .nm{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hueco .mt{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.hueco .pr{margin-left:auto;text-align:right;font-family:var(--f-mono);font-size:13px;font-weight:600;flex:none}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:999px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.pill.ac{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent)}
.pill.wa{background:var(--warn-bg);color:var(--warn)}
.pill.da{background:var(--danger-bg);color:var(--danger)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}

/* ---- resultados ---- */
.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.res > div{background:var(--surface);padding:11px 12px}
.res .k{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.res .v{font-family:var(--f-mono);font-size:19px;font-weight:600;letter-spacing:-.02em;margin-top:2px}
.res .v small{font-size:12px;font-weight:500;color:var(--ink-2);letter-spacing:0}
.res .s{font-size:11.5px;color:var(--ink-2);margin-top:1px}
.res .wide{grid-column:1/-1}

table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:5px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line)}
table.t tr:last-child td{border-bottom:none}
table.t td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.t tr.tot td{font-weight:700;border-top:2px solid var(--line-2);background:var(--surface-2)}
.scroll-x{overflow-x:auto}

.note{display:flex;gap:9px;align-items:flex-start;border-radius:9px;padding:9px 11px;font-size:13px;margin-bottom:7px;line-height:1.35}
.note b{font-weight:600}
.note.w{background:var(--warn-bg);color:var(--warn)}
.note.d{background:var(--danger-bg);color:var(--danger)}
.note.i{background:var(--surface-2);color:var(--ink-2)}
.note.o{background:var(--ok-bg);color:var(--ok)}
.note .ic{font-family:var(--f-mono);font-weight:700;flex:none}

.task{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.task:last-child{border-bottom:none}
.task input{width:19px;height:19px;margin-top:1px;accent-color:var(--accent);flex:none}
.task .tx{font-size:14px}
.task .td{font-size:12px;color:var(--ink-2);margin-top:1px}
.task.done .tx{text-decoration:line-through;color:var(--ink-3)}

.swatches{display:flex;flex-wrap:wrap;gap:7px}
.sw{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 11px 5px 5px;font-size:12.5px;cursor:pointer}
.sw i{width:19px;height:19px;border-radius:50%;border:1px solid var(--line-2);display:block;flex:none}
.sw.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}

svg.elev{display:block;width:100%;max-width:100%;height:auto}

pre.out{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:12px;font-family:var(--f-mono);font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-height:380px;overflow:auto;margin:0}

/* ---- barra fija de resultado ---- */
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:9px 16px calc(9px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.07)}
.sticky-in{max-width:860px;margin:0 auto;display:flex;align-items:center;gap:12px}
.sticky .lb{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.sticky .big{font-family:var(--f-mono);font-size:17px;font-weight:600;letter-spacing:-.02em}
.sticky .sep{width:1px;align-self:stretch;background:var(--line)}
.empty{text-align:center;color:var(--ink-3);padding:26px 10px;font-size:14px}
.fnative{display:block;width:100%;background:var(--surface-2);border:1.5px solid var(--accent);border-radius:9px;padding:12px;font-size:14px;color:var(--ink);cursor:pointer}
.fnative::file-selector-button{font:inherit;background:var(--accent);color:var(--on-accent);border:0;border-radius:7px;padding:9px 13px;margin-right:11px;cursor:pointer}
.ffile{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;opacity:0}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:16px;text-align:center;color:var(--ink-3);font-size:13px;margin-top:10px}
.pastebox{margin-top:8px;padding:11px;font-size:12.5px;cursor:pointer}
.pastebox.arm{border-color:var(--accent);color:var(--accent)}
.drop.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent)}
.impitem{display:flex;gap:11px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:7px;cursor:pointer}
.impitem.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.impitem input{width:19px;height:19px;accent-color:var(--accent);flex:none}
.impitem .nm{display:block;font-weight:600;font-size:14.5px}
.impitem .mt{display:block;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2)}
.impitem .pr{margin-left:auto;font-family:var(--f-mono);font-weight:600;font-size:13px;flex:none}
.logobox{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:11px}
.logoprev{width:104px;height:66px;flex:none;border:1px dashed var(--line-2);border-radius:8px;display:grid;place-items:center;background:var(--surface);overflow:hidden;padding:5px}
.logoprev.has{background:#FFFFFF;border-style:solid}
.logoprev img{max-width:100%;max-height:56px;display:block}
.logoprev span{font-size:10.5px;color:var(--ink-3);text-align:center;letter-spacing:.03em;padding:0 6px}
.btn.sec.sm input[type=file]{position:absolute;width:0;height:0;opacity:0}
.tag-ex{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);font-weight:600}
@media (prefers-reduced-motion:no-preference){ .card,.hueco{transition:border-color .15s ease} }
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <span style="min-width:0">
        <b id="obraName">Obra</b>
        <span id="obraSub">—</span>
      </span>
    </div>
    <div class="top-act">
      <button class="iconbtn" id="btnTheme" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
      <button class="iconbtn" id="btnNew" title="Nuevo hueco" aria-label="Nuevo hueco">+</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
</header>

<main id="view"></main>

<div class="sticky" id="sticky"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0;};
const r0=v=>Math.round(v);
const r1=v=>Math.round(v*10)/10;
const r2=v=>Math.round(v*100)/100;
function miles(v,n){ const neg=v<0; const p=Math.abs(isFinite(v)?v:0).toFixed(n).split("."); p[0]=p[0].replace(/\B(?=(\d{3})+(?!\d))/g,"."); return (neg?"\u2212":"")+p.join(","); }
const eur=v=>miles(v,2)+"\u00a0\u20ac";
const d1=v=>miles(isFinite(v)?v:0,1);
const d2=v=>miles(isFinite(v)?v:0,2);
const qty=v=>(Math.abs(v-Math.round(v))<0.005?miles(Math.round(v),0):miles(v,2));
const uid=()=>Math.random().toString(36).slice(2,9);

/* ============ CATÁLOGOS ============ */
const TIPOS={
  "fijo":            {n:"Fijo (sin apertura)",            hojas:0, fam:"fijo",      ap:"fijo",   horas:1.4},
  "practicable-1":   {n:"Practicable 1 hoja",             hojas:1, fam:"practicable",ap:"prac",  horas:1.8},
  "practicable-2":   {n:"Practicable 2 hojas",            hojas:2, fam:"practicable",ap:"prac",  horas:2.3},
  "oscilo-1":        {n:"Oscilobatiente 1 hoja",          hojas:1, fam:"practicable",ap:"osc",   horas:2.0},
  "oscilo-2":        {n:"Oscilobatiente 2 hojas",         hojas:2, fam:"practicable",ap:"osc",   horas:2.6},
  "abatible":        {n:"Proyectante / abatible",         hojas:1, fam:"practicable",ap:"proy",  horas:1.8},
  "corredera-2":     {n:"Corredera 2 hojas",              hojas:2, fam:"corredera", ap:"corr",  corr:true, horas:2.2},
  "corredera-3":     {n:"Corredera 3 hojas",              hojas:3, fam:"corredera", ap:"corr",  corr:true, horas:2.8},
  "corredera-4":     {n:"Corredera 4 hojas",              hojas:4, fam:"corredera", ap:"corr",  corr:true, horas:3.2},
  "oscilopara-2":    {n:"Oscilo-paralela 2 hojas",        hojas:2, fam:"corredera", ap:"corr",  corr:true, horas:3.0},
  "elevable-2":      {n:"Elevable 2 hojas",               hojas:2, fam:"corredera", ap:"corr",  corr:true, horas:4.0},
  "balconera-2":     {n:"Balconera practicable 2 hojas",  hojas:2, fam:"practicable",ap:"prac", puerta:true, horas:2.6},
  "puerta-entrada":  {n:"Puerta de entrada",              hojas:1, fam:"puerta",    ap:"prac",  puerta:true, horas:3.4},
  "puerta-2":        {n:"Puerta 2 hojas",                 hojas:2, fam:"puerta",    ap:"prac",  puerta:true, horas:3.8},
  "mampara-fija":    {n:"Mampara · panel fijo",           hojas:0, fam:"mampara",   ap:"fijo",  mampara:true, horas:1.6},
  "mampara-corr-2":  {n:"Mampara · corredera 2 hojas",    hojas:2, fam:"mampara",   ap:"corr",  corr:true, mampara:true, horas:2.6},
  "mampara-abat":    {n:"Mampara · fijo + abatible",      hojas:1, fam:"mampara",   ap:"prac",  mampara:true, horas:2.4},
  "mampara-angulo":  {n:"Mampara · angular 2 lados",      hojas:2, fam:"mampara",   ap:"corr",  corr:true, mampara:true, horas:3.4}
};
const MATERIALES={
  "pvc":     {n:"PVC",                  uf:1.3, kgm:1.9, desc:{fijo:48,practicable:58,corredera:52,puerta:62,mampara:0}},
  "pvc-alu": {n:"PVC con cara aluminio",uf:1.4, kgm:2.3, desc:{fijo:50,practicable:60,corredera:54,puerta:64,mampara:0}},
  "alu-rpt": {n:"Aluminio con RPT",     uf:2.2, kgm:1.3, desc:{fijo:40,practicable:50,corredera:46,puerta:54,mampara:0}},
  "alu":     {n:"Aluminio sin RPT",     uf:5.7, kgm:1.1, desc:{fijo:38,practicable:46,corredera:42,puerta:50,mampara:0}},
  "alu-mamp":{n:"Aluminio · perfilería mampara", uf:5.7, kgm:0.8, desc:{fijo:12,practicable:14,corredera:14,puerta:14,mampara:12}}
};
const VIDRIOS={
  "4-16-4":      {n:"4 / 16 / 4 — estándar",                 mm:8,  ug:2.7, pm2:0,  cat:"ventana"},

/* ============ CÁLCULO ============ */
function descAuto(h){
  const M=MATERIALES[h.material]||MATERIALES.pvc, T=TIPOS[h.tipologia];
  return M.desc[T.fam]!==undefined?M.desc[T.fam]:50;
}
function calc(h){
  const T=TIPOS[h.tipologia]||TIPOS["oscilo-2"], M=MATERIALES[h.material]||MATERIALES.pvc;
  const V=VIDRIOS[h.vidrio]||VIDRIOS["4-16-4"];
  const A=num(h.ancho), H=num(h.alto), ud=Math.max(1,num(h.ud)||1);
  const reno=h.instalacion==="renovacion";
  const anchoFab = reno ? A+2*num(h.solLat) : A-2*num(h.holLat);
  const altoFab  = reno ? H+num(h.solSup)+num(h.solInf) : H-num(h.holSup)-num(h.holInf);
  const pers=h.persiana||{};
  const cajon = pers.on&&pers.sistema!=="exterior" ? num(pers.cajon) : 0;
  const restaCajon = pers.on && pers.descontar && pers.sistema!=="exterior" ? cajon : 0;
  const altoVent = altoFab - restaCajon;
  const montante = Math.max(0,Math.min(num(h.montante), altoVent-300));
  const altoHojaZona = altoVent - montante;

  const n = T.hojas||0;
  let anchoHoja=0;
  if(n>0) anchoHoja = T.corr ? (anchoFab + (n-1)*30)/n : anchoFab/n;

  const d = h.autoDesc===false ? num(h.descVidrio) : descAuto(h);
  const piezas=[];
  if(n===0){ piezas.push({t:"Fijo", n:1, a:anchoFab-2*d, h:altoHojaZona-2*d}); }
  else { piezas.push({t:T.corr?"Hoja corredera":"Hoja", n:n, a:anchoHoja-2*d, h:altoHojaZona-2*d}); }
  if(montante>0) piezas.push({t:"Fijo superior", n:1, a:anchoFab-2*d, h:montante-2*d});
  piezas.forEach(p=>{ p.a=Math.max(0,r0(p.a)); p.h=Math.max(0,r0(p.h)); p.m2=r2(p.a*p.h/1e6); });

  const areaVid = piezas.reduce((s,p)=>s+p.n*p.a*p.h,0)/1e6;
  const perimVid = piezas.reduce((s,p)=>s+p.n*2*(p.a+p.h),0)/1000;
  const areaFab = anchoFab*altoFab/1e6;
  const areaHueco = A*H/1e6;
  const pesoVidM2 = V.panel? 11 : V.mm*2.5;
  const pesoVidrio = areaVid*pesoVidM2;

  let pesoHoja=0, perimHoja=0;
  if(n>0){
    perimHoja = 2*(anchoHoja+altoHojaZona)/1000;
    const pv = (anchoHoja-2*d)*(altoHojaZona-2*d)/1e6*pesoVidM2;
    pesoHoja = pv + perimHoja*M.kgm;
  }
  const pesoTotal = pesoVidrio + (2*(anchoFab+altoFab)/1000)*M.kgm*1.15;

  // Persiana
  let P=null;
  if(pers.on){
    const lamaKey=pers.lama||"alu-45", L=LAMAS[lamaKey]||LAMAS["alu-45"];
    const anchoLama = anchoFab - 2*num(pers.guias);
    const altoLama  = altoVent + num(pers.solapeInf);
    const m2 = Math.max(0,anchoLama*altoLama/1e6);
    const peso = m2*L.kgm2;
    const cajonMin = (CAJONES.find(c=>altoLama<=c.max)||CAJONES[CAJONES.length-1]).c;
    const mot = MOTORES.find(m=>peso<=m.max)||MOTORES[MOTORES.length-1];
    P={anchoLama:r0(anchoLama), altoLama:r0(altoLama), m2:r2(m2), peso:r1(peso),
       lama:L.n, cajonMin, cajonOk:num(pers.cajon)>=cajonMin, nm:mot.nm,
       guiaML:r2(2*altoLama/1000), eje:peso>35?"60 mm octogonal":"40 mm octogonal"};
  }

  // Térmico
  const Ag=areaVid, At=Math.max(.01,areaFab), Af=Math.max(0,At-Ag);
  const uw = (Ag*V.ug + Af*M.uf + perimVid*0.06)/At;

  // Luz de paso
  const perfilVisto = T.fam==="corredera"?70:(T.fam==="mampara"?22:62);
  const pasoLibre = n>0 ? r0(T.corr ? anchoFab/n - perfilVisto : anchoFab - 2*perfilVisto - (n>1?perfilVisto:0)) : 0;
  const altoPaso = r0(altoHojaZona - perfilVisto);

  // Materiales de instalación
  const perimML = 2*(anchoFab+altoFab)/1000;
  const lados=[{l:anchoFab,c:2},{l:altoFab,c:2}];
  let tornillos=0; lados.forEach(x=>{ tornillos += x.c*Math.max(2,Math.ceil(x.l/700)+1); });
  const mats=[];
  if(h.instalacion!=="premarco"||h.extras.premarco) mats.push({n:"Espuma PU baja expansión 750 ml",q:Math.ceil(perimML/9),u:"bote"});
  mats.push({n:"Silicona neutra exterior (cartucho 300 ml)",q:Math.ceil(perimML*ud/8),u:"ud"});
  mats.push({n:"Silicona acrílica / masilla interior",q:Math.ceil(perimML*ud/12),u:"ud"});
  mats.push({n:"Tornillo marco 7,5×" + (h.instalacion==="renovacion"?"72":"92") + " mm + taco",q:tornillos*ud,u:"ud"});
  mats.push({n:"Cuñas de nivelación / calzos PVC",q:10*ud,u:"ud"});
  if(h.extras.tapajuntas) mats.push({n:"Tapajuntas a juego (ml)",q:r1((2*altoFab+anchoFab)/1000*ud),u:"ml"});
  if(h.extras.vierteaguas) mats.push({n:"Vierteaguas aluminio (ml)",q:r1((anchoFab+120)/1000*ud),u:"ml"});
  if(h.extras.premarco||h.instalacion==="premarco") mats.push({n:"Premarco acero/PVC (ml)",q:r1(perimML*ud),u:"ml"});
  if(h.extras.remates) mats.push({n:"Banda de estanqueidad / membrana (ml)",q:r1(perimML*ud),u:"ml"});
  if(P){
    mats.push({n:"Guías de persiana (ml)",q:r1(P.guiaML*ud),u:"ml"});
    mats.push({n:"Lama "+P.lama+" (m²)",q:r2(P.m2*ud),u:"m²"});
    mats.push({n:"Eje "+P.eje,q:ud,u:"ud"});
    if(pers.accion==="motor"){ mats.push({n:"Motor tubular "+P.nm+" Nm",q:ud,u:"ud"});
      if(pers.mando) mats.push({n:"Mando / emisor vía radio",q:ud,u:"ud"}); }
    else if(pers.accion==="cinta") mats.push({n:"Recogedor + cinta 22 mm (5 m)",q:ud,u:"ud"});
    else mats.push({n:"Torno con cardan y manivela",q:ud,u:"ud"});
  }
  if(h.extras.mosquitera) mats.push({n:"Mosquitera "+(T.corr?"corredera":"enrollable"),q:ud,u:"ud"});
  if(n>0) mats.push({n:"Manillas "+(h.extras.manillaSeg?"con llave":"estándar"),q:(T.corr?n:n)*ud,u:"ud"});

  // Herraje
  const bisagras = pesoHoja>100?4:(pesoHoja>60?3:2);
  const puntosCierre = n>0 ? Math.max(2,Math.ceil(perimHoja*1000/700)) : 0;

  // Horas
  let horas = T.horas + areaFab*0.35;
  if(h.instalacion==="renovacion") horas+=0.4; else horas+=0.8;
  if(P) horas+= pers.accion==="motor"?1.4:0.9;
  if(h.extras.mosquitera) horas+=0.3;
  horas = r1(horas*ud);

  // Precio
  const t=S.tarifa, C=COLORES.find(c=>c.id===(h.color&&h.color.id))||COLORES[0];
  const m2Fact = Math.max(areaFab, num(t.m2min));
  const pBase = ((t.p[h.material]||t.p.pvc)[T.fam])||200;
  let linea=[];
  const porCoste = h.modoPrecio==="coste" && num(h.coste)>0;
  const base = porCoste ? num(h.coste)*(1+num(t.margen)/100) : m2Fact*pBase;
  linea.push({c:"Unidad "+T.n+" · "+M.n, v:base});
  if(!porCoste){
    const recColor = base*(C.rec + (h.color&&h.color.bicolor?0.06:0));
    if(recColor>0) linea.push({c:"Acabado: "+C.n+(h.color.bicolor?" (bicolor)":""), v:recColor});
    const vidExtra = areaVid*V.pm2;
    if(vidExtra>0) linea.push({c:"Vidrio "+V.n, v:vidExtra});
    if(P){ const persPrecio = P.m2*t.persianaM2 + (pers.accion==="motor"? num(t.motor)+(pers.mando?num(t.mando):0):0);
      linea.push({c:"Persiana "+P.lama+(pers.accion==="motor"?" motorizada":""), v:persPrecio}); }
    if(h.extras.mosquitera){ const v=Math.max(1,areaFab)*t.mosquitera; linea.push({c:"Mosquitera",v:v}); }
    if(h.extras.vierteaguas){ const v=(anchoFab+120)/1000*t.vierteaguas; linea.push({c:"Vierteaguas",v:v}); }
    if(h.extras.premarco||h.instalacion==="premarco"){ const v=perimML*t.premarco; linea.push({c:"Premarco",v:v}); }
    if(h.extras.tapajuntas){ const v=(2*altoFab+anchoFab)/1000*t.tapajuntas; linea.push({c:"Tapajuntas",v:v}); }
    if(h.extras.cierreSeg) linea.push({c:"Herraje antipalanca / seguridad", v:68});
    if(h.extras.limitador) linea.push({c:"Limitador de apertura", v:24*(n||1)});
    if(h.extras.barrotillo) linea.push({c:"Barrotillo interior (cuadrícula)", v:areaVid*42});
  }
  const materialTot = linea.reduce((s,l)=>s+l.v,0)*ud;
  const manoObra = horas*num(t.hora);
  const totalHueco = materialTot + manoObra;

  // Avisos
  const av=[];
  if(A<=0||H<=0) av.push({t:"d",x:"Faltan las medidas del hueco."});
  if(anchoFab<=0||altoVent<=0) av.push({t:"d",x:"Los descuentos dejan la medida de fabricación en cero o negativa. Revisa holguras y cajón."});
  if(h.instalacion==="renovacion") av.push({t:"i",x:"Renovación: la medida de fabricación incluye el solape sobre el marco viejo. Comprueba que el marco antiguo está a plomo y bien anclado antes de tomarla."});
  if(n>0 && anchoHoja>1000 && T.ap!=="corr") av.push({t:"w",x:"Hoja de "+r0(anchoHoja)+" mm: por encima de 1.000 mm conviene bisagra reforzada o repartir en más hojas."});
  if(n>0 && altoHojaZona>2400) av.push({t:"w",x:"Hoja de "+r0(altoHojaZona)+" mm de alto: revisa el máximo del herraje de tu serie."});
  if(T.ap==="osc" && (anchoHoja<380||altoHojaZona<480)) av.push({t:"w",x:"Hoja pequeña para oscilobatiente: el herraje suele pedir mínimo 380×480 mm."});
  if(pesoHoja>80) av.push({t:"w",x:"Hoja de "+r0(pesoHoja)+" kg: herraje reforzado y montaje entre dos personas."});
  if(pesoHoja>130) av.push({t:"d",x:"Más de 130 kg por hoja: fuera del herraje estándar, consulta a fábrica."});
  const mayorM2 = Math.max.apply(null,piezas.map(p=>p.m2).concat([0]));
  if(mayorM2>2.5) av.push({t:"w",x:"Vidrio de "+d2(mayorM2)+" m²: ventosas y dos operarios."});
  if(mayorM2>4) av.push({t:"d",x:"Vidrio por encima de 4 m²: prevé medios de elevación o grúa de cristalero."});
  if(P && !P.cajonOk) av.push({t:"d",x:"El cajón de "+num(pers.cajon)+" mm no recoge "+P.altoLama+" mm de lama. Necesitas al menos "+P.cajonMin+" mm."});
  if(P && P.cajonOk && num(pers.cajon)>P.cajonMin+60) av.push({t:"i",x:"Con un cajón de "+P.cajonMin+" mm bastaría; ganarías "+(num(pers.cajon)-P.cajonMin)+" mm de luz de vidrio."});
  if(V.cat==="mampara" && !T.mampara) av.push({t:"w",x:"Has elegido vidrio templado de mampara en una tipología de ventana."});
  if(V.cat==="ventana" && T.mampara) av.push({t:"w",x:"Una mampara se monta con vidrio templado de 6, 8 o 10 mm."});
  if(h.material==="alu" && V.cat!=="mampara") av.push({t:"w",x:"Aluminio sin rotura de puente térmico: Uw alto y condensaciones en invierno."});
  if(uw>2.2 && V.cat!=="mampara") av.push({t:"w",x:"Uw estimado "+d2(uw)+" W/m²K. El CTE pide valores más bajos en casi toda España; revisa vidrio y perfil."});
  if(uw<=1.6 && V.cat!=="mampara") av.push({t:"o",x:"Uw estimado "+d2(uw)+" W/m²K: buen conjunto para rehabilitación."});
  if(T.puerta && pasoLibre<700 && pasoLibre>0) av.push({t:"w",x:"Paso libre de "+pasoLibre+" mm: por debajo de 700 mm complica accesibilidad y mudanzas."});
  if(T.mampara) av.push({t:"i",x:"Mampara: deja regulación en los perfiles murales y empieza a sellar desde dentro del plato, dejando el cordón exterior continuo."});
  if(h.instalacion==="obra" && !h.extras.premarco) av.push({t:"i",x:"Montaje a hueco sin premarco: calza, aploma y ancla antes de espumar; la espuma no sujeta, solo aísla."});

  return {T,M,V,C,ud,A,H,anchoFab:r0(anchoFab),altoFab:r0(altoFab),altoVent:r0(altoVent),
    cajon,restaCajon,montante,anchoHoja:r0(anchoHoja),altoHoja:r0(altoHojaZona),nHojas:n,
    d,piezas,areaVid:r2(areaVid),areaFab:r2(areaFab),areaHueco:r2(areaHueco),
    pesoVidrio:r1(pesoVidrio),pesoHoja:r1(pesoHoja),pesoTotal:r1(pesoTotal),
    P,uw:r2(uw),pasoLibre,altoPaso,mats,bisagras,puntosCierre,horas,
    linea,materialTot,manoObra,totalHueco,m2Fact:r2(m2Fact),pBase,av,perimML:r2(perimML),
    porCoste,costeProv:porCoste?num(h.coste)*ud:0,margenEur:porCoste?(base-num(h.coste))*ud:0};
}
function totalObra(){
  const t=S.tarifa;
  let mat=0,mo=0,coste=0;
  S.huecos.forEach(h=>{const c=calc(h);mat+=c.materialTot;mo+=c.manoObra;coste+=c.costeProv;});

function elevacion(h,c){

  const xd=x0-14;
  g.push(`<line x1="${xd}" y1="${y0}" x2="${xd}" y2="${y0+hh}" stroke="var(--ink-3)" stroke-width="1"/>`);

  g.push(`<text x="${x0+w+8}" y="${y0+12}" font-size="9" font-family="IBM Plex Mono, monospace" fill="var(--ink-3)">EXT</text>`);
  return `<svg class="elev" viewBox="0 0 ${W+30} ${y0+hh+28}" role="img" aria-label="Alzado del hueco visto desde el interior">${g.join("")}</svg>`;
}

    let res=await dictDe(objs,resv);

function elevPDF(d,x0,yTop,maxW,maxH,c){
  const A=Math.max(1,c.anchoFab), H=Math.max(1,c.altoFab);
  const k=Math.min(maxW/A,maxH/H), w=A*k, h=H*k;
  const x=x0+(maxW-w)/2, yb=yTop-h;
  d.rect(x,yb,w,h,SOFT);
  d.frame(x,yb,w,h,"#5A635F",1.1);
  let yTopInner=yTop;
  if(c.P&&c.restaCajon>0){
    const ch=c.cajon*k;
    d.rect(x,yTop-ch,w,ch,"#E3EDEA");
    d.frame(x,yTop-ch,w,ch,"#5A635F",.7);
    d.text("CAJÓN "+c.cajon,x+w/2,yTop-ch/2-3,{size:6,color:MUT,align:"center"});
    yTopInner=yTop-ch;
  }
  let yh=yTopInner;
  if(c.montante>0){ const mh=c.montante*k;
    d.frame(x+2.5,yTopInner-mh,w-5,mh-2,"#5A635F",.7); yh=yTopInner-mh; }
  const hz=yh-yb, n=c.nHojas;
  if(n===0){ d.frame(x+4,yb+4,w-8,hz-8,"#5A635F",.7); }
  else{
    const hw=w/n;
    for(let i=0;i<n;i++){
      const hx=x+i*hw;
      d.frame(hx+3,yb+3,hw-6,hz-6,"#5A635F",.7);
      const ax=hx+6, ay=yb+6, aw=hw-12, ah=hz-12;
      if(c.T.ap==="prac"||c.T.ap==="osc"){
        if(i%2===0){ d.dash(ax,ay+ah,ax+aw,ay+ah/2,"#7C8781",.6); d.dash(ax+aw,ay+ah/2,ax,ay,"#7C8781",.6); }
        else { d.dash(ax+aw,ay+ah,ax,ay+ah/2,"#7C8781",.6); d.dash(ax,ay+ah/2,ax+aw,ay,"#7C8781",.6); }
        if(c.T.ap==="osc"&&i===0){ d.dash(ax,ay,ax+aw/2,ay+ah,"#7C8781",.6); d.dash(ax+aw/2,ay+ah,ax+aw,ay,"#7C8781",.6); }
      } else if(c.T.ap==="proy"){ d.dash(ax,ay,ax+aw/2,ay+ah,"#7C8781",.6); d.dash(ax+aw/2,ay+ah,ax+aw,ay,"#7C8781",.6); }
      else if(c.T.ap==="corr"){ const my=yb+hz/2, dir=i%2===0?1:-1, sx=hx+hw/2-10*dir, ex=hx+hw/2+10*dir;
        d.line(sx,my,ex,my,"#7C8781",.8); d.line(ex,my,ex-4*dir,my-2.5,"#7C8781",.8); d.line(ex,my,ex-4*dir,my+2.5,"#7C8781",.8); }
      if(i>0) d.line(hx,yb,hx,yh,"#5A635F",.7);
    }
  }
  d.line(x,yb-9,x+w,yb-9,"#7C8781",.5);
  d.line(x,yb-12,x,yb-6,"#7C8781",.5); d.line(x+w,yb-12,x+w,yb-6,"#7C8781",.5);
  d.text(String(c.anchoFab),x+w/2,yb-19,{size:7,align:"center",color:MUT});
  d.text(String(c.altoFab),x-6,yb+h/2,{size:7,align:"right",color:MUT});
  return h+26;
}

let _dl=null,_dlDone=false;
async function getDL(){

  _dlDone=true;
  try{ _dl = (window.claude&&window.claude.use) ? await window.claude.use("downloads") : null; }catch(e){ _dl=null; }

function msgBox(id,tipo,txt){ const el=document.getElementById(id); if(!el) return;
  el.innerHTML='<div class="note '+tipo+'"><span class="ic">'+({o:"OK",w:"!",d:"!!",i:"i"}[tipo])+'</span><span>'+esc(txt)+'</span></div>';

async function descargarPDF(tipo,boxId){
  const btn=document.querySelector('[data-act="'+(tipo==="presupuesto"?"pdf":"pdftaller")+'"]');
  if(btn){ btn.disabled=true; btn.dataset.old=btn.textContent; btn.textContent="Generando PDF…"; }
  try{
    const bytes = tipo==="presupuesto"?pdfPresupuesto():pdfTaller();
    const nom = (tipo==="presupuesto"?"Presupuesto":"Hoja-de-taller")+" "+((S.obra.nombre||"obra").replace(/[\\/:*?"<>|]/g,"-").slice(0,50))+".pdf";
    const dl=await getDL();
    if(!dl){
      // archivo portable o navegador normal: descarga clásica
      try{
        const url=URL.createObjectURL(new Blob([bytes],{type:"application/pdf"}));
        const a=document.createElement("a");
        a.href=url; a.download=nom; a.rel="noopener";
        document.body.appendChild(a); a.click();
        setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); },4000);
        msgBox(boxId,"o","PDF generado: "+nom);
      }catch(e){ msgBox(boxId,"w","Este visor no deja guardar archivos. Abre la app en el navegador del móvil o del ordenador y vuelve a pulsar."); }
      return;
    }
    const r=await dl.save({filename:nom,data:new Blob([bytes],{type:"application/pdf"})});
    if(r&&r.status==="saved") msgBox(boxId,"o","PDF guardado: "+nom);
  }catch(err){
    const c=err&&err.code;
    if(c==="declined") msgBox(boxId,"i","Descarga cancelada.");
    else if(c==="rate_limited") msgBox(boxId,"i","Espera un segundo y vuelve a pulsar.");
    else msgBox(boxId,"d","No se ha podido generar el PDF"+(c?" ("+c+")":"")+". Avísame y lo reviso.");
  } finally {
    const b=document.querySelector('[data-act="'+(tipo==="presupuesto"?"pdf":"pdftaller")+'"]');
    if(b&&b.dataset.old){ b.disabled=false; b.textContent=b.dataset.old; delete b.dataset.old; }
  }
}

/* Lectura de partidas sin IA: funciona también en el archivo portable */
const RAL_COMUNES=[9016,9005,9001,9010,9003,9006,7016,7038,7035,7001,7012,7021,1013,1015,6005,6009,8017,8019,8014,3004,5003,5010,2001,7039,7022];
function medidaEn(txt){
  // 1) medidas en metros: 1,20 x 1,35
  let m=/(\d{1,2}[.,]\d{1,3})\s*(?:x|×|\*)\s*(\d{1,2}[.,]\d{1,3})/i.exec(txt);
  if(m){
    const a=parseFloat(m[1].replace(",",".")), h=parseFloat(m[2].replace(",","."));
    if(a>=0.2&&a<=6&&h>=0.2&&h<=6) return {a:Math.round(a*1000),h:Math.round(h*1000)};
  }
  // 2) etiquetas: ANCHO 1500 ALTO 1100 · A: 1,50 H: 1,10 · L=1500 H=1100
  const NUM="(\\d{1,4}(?:[.,]\\d{1,3})?)";
  let ra=new RegExp("(?:anch[oa]|anchura)\\s*[:=]?\\s*"+NUM,"i").exec(txt);
  let rh=new RegExp("(?:alt[oa]|altura)\\s*[:=]?\\s*"+NUM,"i").exec(txt);
  if(!(ra&&rh)){   // solo si no hay palabras completas: A = 1200  H = 1500
    const ra2=new RegExp("\\bA\\s*[:=]\\s*"+NUM).exec(txt), rh2=new RegExp("\\bH\\s*[:=]\\s*"+NUM).exec(txt);
    if(ra2&&rh2){ ra=ra2; rh=rh2; }
  }
  if(ra&&rh){
    let a=parseFloat(ra[1].replace(",",".")), h=parseFloat(rh[1].replace(",","."));
    if(a<10) a*=1000; else if(a<400) a*=10;
    if(h<10) h*=1000; else if(h<400) h*=10;
    if(a>=300&&a<=6000&&h>=300&&h<=6000) return {a:Math.round(a),h:Math.round(h)};
  }
  // 3) medidas enteras: 1200 x 1500 (o en cm si lo dice)
  const cm=/\bcm\b/i.test(txt);
  const reA=/(\d{2,4})\s*(?:x|×|\*)/gi; let an=0, pos=-1;
  while((m=reA.exec(txt))){
    let v=+m[1];
    if(cm&&v>=30&&v<=400) v*=10;
    if(v>=300&&v<=6000&&RAL_COMUNES.indexOf(v)<0){ an=v; pos=m.index+m[0].length; break; }
  }
  if(!an) return null;
  const resto=txt.slice(pos);
  const reB=/\d{2,4}/g; let x, al=0;
  while((x=reB.exec(resto))){
    const i0=x.index, i1=i0+x[0].length;
    const prev=resto.charAt(i0-1)||" ", next=resto.charAt(i1)||" ";
    if(/[\d.,]/.test(prev)||/[\d.,]/.test(next)) continue;
    let v=+x[0];
    if(cm&&v>=30&&v<=400) v*=10;
    if(RAL_COMUNES.indexOf(v)>=0||v<300||v>6000) continue;
    al=v; break;
  }
  return al?{a:an,h:al}:null;
}
function valorEur(t){ return parseFloat(String(t).replace(/\./g,"").replace(",",".")); }
const RE_PRECIO=/\d{1,3}(?:\.\d{3})+,\d{2}|\d+,\d{2}/g;
const RE_MED_DEC=/(\d{1,2}[.,]\d{1,3})\s*(?:x|×|\*)\s*(\d{1,2}[.,]\d{1,3})/gi;
function preciosDe(linea){
  const limpio=String(linea).replace(RE_MED_DEC," "); RE_MED_DEC.lastIndex=0;
  RE_PRECIO.lastIndex=0;
  return limpio.match(RE_PRECIO)||[];
}
const RE_RESUMEN=/base imponible|^\s*total|total:|total en|\bi\.?v\.?a\b|subtotal|suma |portes|transporte|descuento global|forma de pago|plazo de|iban|c\.i\.f|cif |telefono|tel\./i;
function lineaUtil(l){
  if(RE_RESUMEN.test(String(l).toLowerCase())) return false;
  const letras=(String(l).match(/[A-Za-zÁÉÍÓÚÑáéíóúñ]/g)||[]).length;
  const piezas=String(l).trim().split(/\s+/);
  if(letras===0 && piezas.length===1 && piezas[0].length>8) return false;   // churro de cotas del dibujo
  return true;
}
function atributosDe(win, nombreBase){
  const ESTANCIAS=["salón","salon","cocina","baño","bano","aseo","dormitorio","habitación","habitacion","terraza","pasillo","comedor","despacho","garaje","trastero","recibidor","ático","atico","buhardilla","estudio","vestíbulo","vestibulo"];
  const t=win.toLowerCase();
  let tip="practicable-1";
  const hojas=(/(\d)\s*hoja/.exec(t)||[])[1];
  if(/mampara/.test(t)) tip=/corredera|deslizante/.test(t)?"mampara-corr-2":(/abatible|batiente/.test(t)?"mampara-abat":"mampara-fija");
  else if(/oscilo\s*-?\s*paralel/.test(t)) tip="oscilopara-2";
  else if(/oscilo/.test(t)) tip=hojas==="2"?"oscilo-2":"oscilo-1";
  else if(/elevable/.test(t)) tip="elevable-2";
  else if(/corredera|deslizante/.test(t)) tip=hojas==="4"?"corredera-4":(hojas==="3"?"corredera-3":"corredera-2");
  else if(/balconera/.test(t)) tip="balconera-2";
  else if(/puerta/.test(t)) tip=hojas==="2"?"puerta-2":"puerta-entrada";
  else if(/proyectante|abatible/.test(t)) tip="abatible";
  else if(/\bfij[oa]\b/.test(t)) tip="fijo";
  else if(/practicable|ventana/.test(t)) tip=hojas==="2"?"practicable-2":"practicable-1";
  let mat="pvc";
  if(/mampara/.test(t)) mat="alu-mamp";
  else if(/pvc/.test(t)) mat="pvc";
  else if(/alumini/.test(t)) mat=/rpt|rotura|puente t/.test(t)?"alu-rpt":"alu";
  let col="blanco";
  if(/antracita|7016/.test(t)) col="antracita";
  else if(/negro|9005/.test(t)) col="negro";
  else if(/roble/.test(t)) col="roble";
  else if(/nogal/.test(t)) col="nogal";
  else if(/anodizado/.test(t)) col="anodizado";
  else if(/7038|ágata|agata/.test(t)) col="gris7038";
  let vid="4be-16-4";
  if(/templado\s*10/.test(t)) vid="templado-10";
  else if(/templado\s*6/.test(t)) vid="templado-6";
  else if(/templado|mampara/.test(t)) vid="templado-8";
  else if(/triple/.test(t)) vid="triple";
  else if(/4\s*\+\s*4/.test(t)) vid="44-16-4be";
  else if(/control solar|cool.?lite|stopsol|antelio|sunguard|reflectasol/.test(t)) vid="ctrl-solar";
  else if(/g\.?\s?sun|guardian sun|planitherm|climaguard|low.?e|planistar|eclaz/.test(t)) vid="4be-16-4";
  else if(/bajo emisivo|b\.?e\.?[\s,.]|térmic|termic/.test(t)) vid="4be-16-4";
  else vid="4-16-4";
  const pers={on:/persiana/.test(t) && !/sin persiana|no lleva persiana|sin caj[óo]n|persiana:\s*no/.test(t)};
  if(pers.on){
    const cj=/caj[óo]n[^.\n]{0,45}?\b(1[3-9]\d|2[0-9]\d|3[0-5]\d)\b/.exec(t) || /\b(1[3-9]\d|2[0-9]\d|3[0-5]\d)\s*(?:mm)?\s*(?:de\s*)?caj[óo]n/.exec(t);
    pers.cajon=cj?+cj[1]:185;
    const tras=t.split("persiana")[1]||t;
    pers.lama=/alumini/.test(tras)?"alu-45":"pvc-38";
    pers.accion=/motor/.test(t)?"motor":(/torno/.test(t)?"torno":"cinta");
  }
  const extras=[];
  if(/mosquitera/.test(t)) extras.push("mosquitera");
  if(/vierteaguas/.test(t)) extras.push("vierteaguas");
  if(/premarco/.test(t)) extras.push("premarco");
  if(/tapajuntas/.test(t)) extras.push("tapajuntas");
  return {tip:tip,mat:mat,col:col,vid:vid,pers:pers,extras:extras,est:ESTANCIAS.filter(e=>t.indexOf(e)>=0)[0]};
}
function limpiaNombre(desc,est,tip){
  let nombre=String(desc||"").replace(/^[\s|]*\d{1,3}[\s.\-|)]+/,"")
    .replace(/(\d{3,4})\s*(?:x|×)\s*(\d{3,4})?/gi,"")
    .replace(/\s{2,}/g," ").replace(/[\s.\-·|,]+$/,"").trim();
  if(est && nombre.toLowerCase().indexOf(est)<0) nombre=est.charAt(0).toUpperCase()+est.slice(1)+" · "+nombre;
  if(nombre.length>70) nombre=nombre.slice(0,70).trim();
  return nombre||TIPOS[tip].n;
}
const RE_CARPINTERIA=/ventana|corredera|practicable|oscilo|mampara|puerta|balconera|elevable|abatible|proyectante|\bfij[oa]\b|deslizante|softslide|monoblock/i;
const RE_RUIDO=/base imponible|iva|^total|presupuesto|cliente|obra:|descripci|importe|fecha|^cif|tel\.|@|pol\.|nave |p\.unit|precio ud|responsable|comercial|referencia|tapajuntas|herraje|guía|guia|accionamiento|auxiliares|marco ---|hoja ---|vidrio---|www\.|iban/i;
function mejorDescripcion(bloque){
  const limpias=bloque.map(x=>{
    let l=String(x).replace(RE_PRECIO," ").replace(/[€]/g,"").replace(/^[\s|]*\d{1,4}\s+/,"").trim();
    RE_PRECIO.lastIndex=0; return l;
  }).filter(l=>(l.match(/[A-Za-zÁÉÍÓÚÑáéíóúñ]/g)||[]).length>8 && !RE_RUIDO.test(l));
  // primero, la línea que nombra el tipo de carpintería
  let desc="";
  limpias.forEach(l=>{ if(RE_CARPINTERIA.test(l) && l.length>desc.length) desc=l; });
  if(desc) return desc;
  limpias.forEach(l=>{ if(l.length>desc.length) desc=l; });
  return desc;
}
/* Pasada A: presupuestos organizados por "Pos. 1", "Partida 2", "Ref. 3"... */
function partidasPorPosicion(lineas){
  const reCab=/^\s*(?:pos\.?|posici[óo]n|partida|l[íi]nea|art[íi]culo|art\.?|ref\.?|elemento|hueco|ventana)\s*[:nº#\-]*\s*(\d{1,3})\b/i;
  const marcas=[];
  lineas.forEach((l,i)=>{ if(reCab.test(l)) marcas.push(i); });
  if(marcas.length<1) return [];
  const items=[];
  for(let k=0;k<marcas.length;k++){
    const a=marcas[k], b=(k+1<marcas.length)?marcas[k+1]:lineas.length;
    const bloque=[];
    for(let j=a;j<b;j++){
      if(/base imponible|total en|forma de pago|condiciones|iban/i.test(lineas[j])) break;
      bloque.push(lineas[j]);
    }
    const win=bloque.join(" ");
    const med=medidaEn(win);
    if(!med) continue;
    // precio: la línea de unidades manda; si no, la que hable de importe; si no, la última con precio
    const util=bloque.filter(lineaUtil).filter(l=>preciosDe(l).length);
    let linP = util.filter(l=>/\buds?\b|unidades/i.test(l)).pop()
            || util.filter(l=>/importe|total|precio|p\.v\.p|neto/i.test(l)).pop()
            || util.pop();
    if(!linP) continue;
    const precios=preciosDe(linP);
    let coste=valorEur(precios[precios.length-1]);
    if(!isFinite(coste)||coste<=0||coste>500000) continue;
    let ud=1;
    const mu=/(\d{1,2})\s*(?:uds?\b|unid)/i.exec(win) || /\buds?\b\s*[:=.]?\s*(\d{1,2})/i.exec(win) || /unidades\s*[:=]?\s*(\d{1,2})/i.exec(win);
    if(mu && +mu[1]>0 && +mu[1]<100) ud=+mu[1];
    const A=atributosDe(win);
    items.push({nombre:limpiaNombre(mejorDescripcion(bloque),A.est,A.tip),tipologia:A.tip,material:A.mat,
      ancho:med.a,alto:med.h,ud:ud,color:A.col,vidrio:A.vid,persiana:A.pers,extras:A.extras,coste:coste,notas:""});
  }
  return items;
}
/* Pasada B: presupuestos en tabla, una partida por línea de precio */
function partidasPorPrecio(lineas){
  const items=[];
  for(let i=0;i<lineas.length;i++){
    const L=lineas[i];
    if(!lineaUtil(L)) continue;
    const precios=preciosDe(L);
    if(!precios.length) continue;
    let coste=valorEur(precios[precios.length-1]);
    if(!isFinite(coste)||coste<=0||coste>500000) continue;
    const esCabecera=x=>/^\s*(pos\.?|ref\.?|partida|art\.?|c[oó]d\.?|item|linea|línea)\s*[:nº#]*\s*\d/i.test(x||"");
    const bloque=[L];
    for(let k=i-1;k>=Math.max(0,i-5);k--){
      if(preciosDe(lineas[k]).length) break;
      bloque.unshift(lineas[k]);
      if(esCabecera(lineas[k])) break;
    }
    for(let k=i+1;k<Math.min(lineas.length,i+3);k++){
      if(preciosDe(lineas[k]).length||esCabecera(lineas[k])) break;
      bloque.push(lineas[k]);
    }
    const win=bloque.join(" ");
    const med=medidaEn(L)||medidaEn(win);
    if(!med) continue;
    let ud=1;
    const mu=/(\d{1,2})\s*(?:uds?\b|unid)/i.exec(L) || /\buds?\b\s*[:=.]?\s*(\d{1,2})/i.exec(L) || /unidades\s*[:=]?\s*(\d{1,2})/i.exec(L);
    if(mu && +mu[1]>0 && +mu[1]<100) ud=+mu[1];
    if(precios.length>=2){
      const ant=valorEur(precios[precios.length-2]);
      if(isFinite(ant)&&ant>0){
        if(ud>1 && Math.abs(ant*ud-coste)<=Math.max(0.02,coste*0.005)) coste=ant;
        else if(ud===1){ for(let k=2;k<=30;k++){ if(Math.abs(ant*k-coste)<=Math.max(0.02,coste*0.005)){ ud=k; coste=ant; break; } } }
      }
    }
    const A=atributosDe(win);
    items.push({nombre:limpiaNombre(mejorDescripcion(bloque),A.est,A.tip),tipologia:A.tip,material:A.mat,
      ancho:med.a,alto:med.h,ud:ud,color:A.col,vidrio:A.vid,persiana:A.pers,extras:A.extras,coste:coste,notas:""});
  }
  return items;
}
function parsearLocal(texto){
  const lineas=String(texto).split(/\r?\n/);
  let items=partidasPorPosicion(lineas);
  if(items.length<1) items=partidasPorPrecio(lineas);
  const vistos={}, out=[];
  items.forEach(it=>{ const k=it.ancho+"|"+it.alto+"|"+it.coste+"|"+it.ud; if(vistos[k]) return; vistos[k]=1; out.push(it); });
  return out;
}
async function interpretarPDF(){
  const box="impMsg2";
  if(!IMP.texto || IMP.texto.trim().length<40){ msgBox(box,"d","Pega o carga antes el texto del presupuesto."); return; }
  IMP.estado="pensando"; renderAll();
  try{
    const sm = (window.claude&&window.claude.use) ? await window.claude.use("sample") : null;
    if(!sm){
      const loc=parsearLocal(IMP.texto);
      IMP.estado=""; IMP.auto=true;
      if(!loc.length){ renderAll(); msgBox(box,"w","No he reconocido ninguna partida con medidas y precio. Revisa el texto o crea los huecos a mano."); return; }
      IMP.items=loc.map(it=>({sel:true,it:it})); IMP.estado="listo"; renderAll(); return;
    }
    IMP.auto=false;
    const r=await sm.json(promptImport(IMP.texto),{modelTier:"complex"});
    const items=(r&&r.items)||[];
    if(!items.length){ IMP.estado=""; renderAll(); msgBox(box,"w","No he reconocido partidas de carpintería en ese texto. Revisa que se haya copiado entero."); return; }
    if(r.medidas==="hueco") IMP.fabricacion=false;
    if(r.proveedor) S.obra.proveedor=Object.assign({texto:IMP.texto.slice(0,6000)},r.proveedor);
    IMP.items=items.map(it=>({sel:true,it:it}));
    IMP.estado="listo";
    renderAll();
  }catch(err){
    IMP.estado=""; renderAll();
    const c=err&&err.code;
    if(c==="not_granted") msgBox(box,"w","No se ha dado permiso para la lectura automática. Vuelve a pulsar y acepta, o crea los huecos a mano.");
    else if(c==="rate_limited") msgBox(box,"i","Demasiadas peticiones seguidas. Espera unos segundos y vuelve a pulsar.");
    else msgBox(box,"d","No he podido interpretar el presupuesto. Prueba a recortar el texto a la tabla de partidas y vuelve a intentarlo.");
  }
}
async function cargarPDFProveedor(file){
  const box="impMsg2";
  if(!file) return;
  if(!/\.pdf$/i.test(file.name||"") && file.type!=="application/pdf"){ msgBox(box,"d","Eso no es un PDF. Si tienes el presupuesto en otro formato, copia el texto y pégalo abajo."); return; }
  if(file.size>25*1024*1024){ msgBox(box,"d","El PDF pesa más de 25 MB."); return; }
  IMP.archivo=file.name||"presupuesto.pdf";
  msgBox(box,"i","Leyendo el PDF…");
  try{
    if(typeof DecompressionStream==="undefined"){
      msgBox(box,"w","Este navegador no puede abrir PDFs comprimidos. Ábrelo en el navegador del móvil o del ordenador, o copia las partidas en el cuadro de abajo."); return; }
    const buf=await file.arrayBuffer();
    const r=await PDFTexto.extraer(new Uint8Array(buf),15);
    const txt=r.paginas.join("\n\n").trim();
    if(!txt){ msgBox(box,"w","Ese PDF no lleva texto dentro: es un escaneo o una imagen. Copia las partidas a mano en el cuadro de abajo."); return; }
    IMP.texto=txt; IMP.items=[]; IMP.estado="";
    clearTimeout(refresh._t); renderAll();
    msgBox(box,"o","Leídas "+r.paginas.length+" de "+r.total+" páginas. Revisa el texto y pulsa Interpretar.");
  }catch(e){
    if(e&&e.message==="cifrado") msgBox(box,"d","El PDF está protegido con contraseña. Ábrelo, imprímelo a PDF sin protección y vuelve a subirlo.");
    else if(e&&e.message==="no-pdf") msgBox(box,"d","El archivo no parece un PDF válido.");
    else msgBox(box,"d","No he podido leer ese PDF. Copia el texto del presupuesto y pégalo en el cuadro de abajo.");
  }
}

/* ---- carga de logotipos ---- */
function cargarLogo(file,slot){
  const box="logoMsg";
  if(!file) return;
  if(!/^image\//.test(file.type)){ msgBox(box,"d","Ese archivo no es una imagen. Sube un PNG, JPG o WEBP."); return; }
  if(file.size>8*1024*1024){ msgBox(box,"d","La imagen pesa más de 8 MB. Reduce el tamaño antes de subirla."); return; }
  const fr=new FileReader();
  fr.onerror=()=>msgBox(box,"d","No se ha podido leer el archivo.");
  fr.onload=()=>{
    const img=new Image();
    img.onerror=()=>msgBox(box,"d","No se ha podido abrir la imagen. Si es un SVG, expórtalo a PNG y vuelve a intentarlo.");
    img.onload=()=>{
      const maxw=760, k=Math.min(1,maxw/(img.naturalWidth||img.width||maxw));
      const w=Math.max(1,Math.round((img.naturalWidth||img.width)*k)), hh=Math.max(1,Math.round((img.naturalHeight||img.height)*k));
      const cv=document.createElement("canvas"); cv.width=w; cv.height=hh;
      const ctx=cv.getContext("2d");
      ctx.fillStyle="#FFFFFF"; ctx.fillRect(0,0,w,hh);
      ctx.drawImage(img,0,0,w,hh);
      let data;
      try{ data=cv.toDataURL("image/jpeg",0.86); }catch(e){ msgBox(box,"d","El navegador ha bloqueado la conversión de esa imagen."); return; }
      S.empresa[slot]={data:data,w:w,h:hh};
      try{ save(); }catch(e){}
      const probe=(()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); return true; }catch(e){ return false; } })();
      clearTimeout(refresh._t); renderAll();
      if(!probe) msgBox(box,"w","El logotipo se ha cargado, pero no cabe en el almacenamiento del navegador. Usa una imagen más pequeña si quieres conservarlo al cerrar.");
      else msgBox(box,"o","Logotipo cargado.");
    };
    img.src=fr.result;
  };
  fr.readAsDataURL(file);
}

function avisosHTML(c){

function textoPedido(){
  const L=[], t=S.tarifa, T=totalObra();
  L.push("HOJA DE PEDIDO Y MEDIDAS");
  L.push("Obra: "+S.obra.nombre);
  L.push("Cliente: "+S.obra.cliente+(S.obra.tel?" · "+S.obra.tel:""));
  L.push("Fecha: "+S.obra.fecha+(S.obra.medidor?" · Medidor: "+S.obra.medidor:""));
  if(S.obra.notas) L.push("Notas: "+S.obra.notas);
  L.push("");
  S.huecos.forEach((h,i)=>{ const c=calc(h), C=c.C;
    L.push("── "+String(i+1).padStart(2,"0")+" · "+h.nombre+(c.ud>1?"  ×"+c.ud:""));
    L.push("   Tipología: "+c.T.n+" · "+c.M.n+(h.serie?" · "+h.serie:""));
    L.push("   Instalación: "+({obra:"a hueco de obra",premarco:"sobre premarco",renovacion:"renovación con solape"}[h.instalacion]));
    L.push("   Hueco: "+c.A+" × "+c.H+" mm");
    L.push("   FABRICACIÓN: "+c.anchoFab+" × "+c.altoFab+" mm"+(c.restaCajon?"  (cajón "+c.cajon+" mm incluido)":""));
    if(c.nHojas) L.push("   Hoja: "+c.anchoHoja+" × "+c.altoHoja+" mm ("+c.nHojas+" hojas)");
    if(c.montante) L.push("   Fijo superior: "+c.montante+" mm");
    L.push("   Color: "+C.n+(h.color.bicolor?" / interior "+(COLORES.find(x=>x.id===h.color.interior)||C).n:""));
    L.push("   Vidrio: "+c.V.n);
    c.piezas.forEach(p=>L.push("     · "+p.n*c.ud+" ud  "+p.a+" × "+p.h+" mm  ("+p.t+")"));
    if(c.P){ const p=h.persiana;
      L.push("   Persiana: "+c.P.lama+" · cajón "+num(p.cajon)+" mm · lama "+c.P.anchoLama+" × "+c.P.altoLama+" mm");
      L.push("     Accionamiento: "+({cinta:"cinta y recogedor",torno:"torno",motor:"motor "+c.P.nm+" Nm"}[p.accion])+(p.accion==="motor"&&p.mando?" + mando":""));
      if(!c.P.cajonOk) L.push("     *** CAJÓN INSUFICIENTE: mínimo "+c.P.cajonMin+" mm ***");
    }
    const ex=Object.keys(h.extras).filter(k=>h.extras[k]);
    if(ex.length) L.push("   Extras: "+ex.map(k=>({mosquitera:"mosquitera",vierteaguas:"vierteaguas",premarco:"premarco",tapajuntas:"tapajuntas",manillaSeg:"manilla con llave",cierreSeg:"herraje antipalanca",limitador:"limitador",barrotillo:"barrotillo",remates:"remates y banda"}[k]||k)).join(", "));
    if(h.notas) L.push("   Nota: "+h.notas);
    L.push("   Peso conjunto: "+d1(c.pesoTotal)+" kg · "+(c.T.mampara?"":"Uw ~"+d2(c.uw)+" W/m²K · ")+d1(c.horas)+" h de montaje");
    L.push("");
  });
  L.push("── MATERIAL DE INSTALACIÓN (toda la obra)");
  const todos={};
  S.huecos.forEach(x=>{ calc(x).mats.forEach(m=>{ todos[m.n]=todos[m.n]||{n:m.n,q:0,u:m.u}; todos[m.n].q+=m.q; }); });
  Object.values(todos).sort((a,b)=>a.n.localeCompare(b.n,"es")).forEach(m=>L.push("   "+qty(m.q)+" "+m.u+"  "+m.n));
  L.push("");
  L.push("── PRESUPUESTO");
  S.huecos.forEach((h,i)=>L.push("   "+String(i+1).padStart(2,"0")+" "+h.nombre+": "+eur(calc(h).totalHueco)));
  L.push("   Desplazamiento y retirada: "+eur(T.extras));
  if(T.dto>0) L.push("   Descuento "+num(t.descuento)+" %: −"+eur(T.dto));
  L.push("   Base imponible: "+eur(T.base));
  L.push("   IVA "+num(t.iva)+" %: "+eur(T.iva));
  L.push("   TOTAL: "+eur(T.total));
  return L.join("\n");
}

}
function refresh(){
  // actualiza resultados sin tocar los campos en edición
  renderSticky();
  const h=sel();
  if(h){ const av=document.getElementById("avisos"); if(av) av.innerHTML=avisosHTML(calc(h)); }
  $("#obraName").textContent=S.obra.nombre||"Obra";
  $("#obraSub").textContent=(S.obra.cliente||"")+(S.obra.fecha?" · "+S.obra.fecha:"");
  if(S.tab==="medidas"||S.tab==="persiana"||S.tab==="vidrio"||S.tab==="materiales"||S.tab==="precio"||S.tab==="obra"||S.tab==="montaje"){
    // re-render diferido de paneles de resultado
    clearTimeout(refresh._t);
    refresh._t=setTimeout(()=>{ const act=document.activeElement, p=act&&act.dataset?act.dataset.path:null;
      const ss=act&&act.selectionStart, se=act&&act.selectionEnd;
      renderAll();
      if(p){ const el=document.querySelector('[data-path="'+p+'"]'); if(el){ el.focus();
        try{ if(ss!=null&&el.setSelectionRange) el.setSelectionRange(ss,se); }catch(e){} } }
    },420);
  }
  save();
}

/* ============ EVENTOS ============ */
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="impTexto"){ IMP.texto=el.value; return; }
  if(el.dataset && el.dataset.path){
    const v = el.type==="checkbox" ? el.checked : (el.type==="number" ? num(el.value) : el.value);
    setPath(el.dataset.path,v);
    if(el.dataset.path==="tipologia"||el.dataset.path==="material"){ const h=sel(); if(h.autoDesc!==false) h.descVidrio=descAuto(h); }
    refresh();
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset && el.dataset.path){
    const v = el.type==="checkbox" ? el.checked : (el.tagName==="SELECT"||el.type!=="number" ? el.value : num(el.value));
    setPath(el.dataset.path, el.type==="number"?num(el.value):v);
    const h=sel();
    if(el.dataset.path==="tipologia"){ const T=TIPOS[h.tipologia];
      if(T.mampara && VIDRIOS[h.vidrio].cat!=="mampara") h.vidrio="templado-8";
      if(!T.mampara && VIDRIOS[h.vidrio].cat==="mampara") h.vidrio="4be-16-4";
      if(T.mampara) h.persiana.on=false;
    }
    if(el.dataset.path==="material"||el.dataset.path==="tipologia"){ if(h.autoDesc!==false) h.descVidrio=descAuto(h); }
    if(el.dataset.struct){ clearTimeout(refresh._t); renderAll(); } else refresh();
  }
  if(el.id==="pdfProv"){ const f=el.files&&el.files[0]; el.value=""; cargarPDFProveedor(f); return; }
  if(el.id==="impFab"){ IMP.fabricacion=el.checked; return; }
  if(el.dataset && el.dataset.imp!==undefined){
    const i=+el.dataset.imp;
    if(IMP.items[i]){ IMP.items[i].sel=el.checked; el.closest(".impitem").classList.toggle("on",el.checked);
      const b=document.querySelector('[data-act="impcrear"]');
      if(b) b.textContent="Crear "+IMP.items.filter(r=>r.sel).length+" huecos"; }
    return;
  }
  if(el.dataset && el.dataset.logo){
    const f=el.files&&el.files[0];
    el.value="";
    cargarLogo(f,el.dataset.logo);
    return;
  }
  if(el.dataset && el.dataset.task){
    const h=sel(); h.tareas=h.tareas||{}; h.tareas[el.dataset.task]=el.checked;
    el.closest(".task").classList.toggle("done",el.checked);
    const done=TAREAS.filter(t=>h.tareas[t.k]).length;
    const sub=document.querySelector(".sect-sub"); if(sub) sub.textContent=h.nombre+" · "+done+"/"+TAREAS.length+" completado · "+d1(calc(h).horas)+" h estimadas";
    save();
  }
});
document.addEventListener("click",e=>{
  const tab=e.target.closest("[data-tab]");
  if(tab){ S.tab=tab.dataset.tab; clearTimeout(refresh._t); renderAll(); window.scrollTo({top:0,behavior:"instant"}); return; }
  const pick=e.target.closest("[data-pick]");
  if(pick){ S.sel=pick.dataset.pick; S.tab="medidas"; clearTimeout(refresh._t); renderAll(); window.scrollTo({top:0}); return; }
  const col=e.target.closest("[data-color]");
  if(col){ sel().color.id=col.dataset.color; clearTimeout(refresh._t); renderAll(); return; }
  const pb=e.target.closest("[data-paste]");
  if(pb){ PASTE_SLOT=pb.dataset.paste;
    document.querySelectorAll(".pastebox").forEach(x=>x.classList.remove("arm"));
    pb.classList.add("arm"); pb.textContent="Listo: mantén pulsado aquí y elige Pegar";
    pb.focus(); return; }
  const act=e.target.closest("[data-act]");
  if(!act) return;
  const a=act.dataset.act, h=sel();
  if(a==="irimportar"){ S.tab="importar"; clearTimeout(refresh._t); renderAll(); window.scrollTo({top:0}); return; }
  if(!h && (a==="dup"||a==="del"||a==="pdf"||a==="pdftaller")){
    msgBox("pdfMsgE","w","Añade o importa al menos un hueco antes de generar el presupuesto."); return; }
  if(a==="pdf"||a==="pdftaller"){
    const box=document.getElementById("pdfMsgP")?"pdfMsgP":(document.getElementById("pdfMsgD")?"pdfMsgD":"pdfMsgE");
    descargarPDF(a==="pdf"?"presupuesto":"taller",box);
  }
  else if(a==="impleer"){ const ta=document.getElementById("impTexto"); if(ta) IMP.texto=ta.value; interpretarPDF(); }
  else if(a==="impborrar"){ IMP={texto:"",items:[],estado:"",archivo:"",fabricacion:IMP.fabricacion}; clearTimeout(refresh._t); renderAll(); }
  else if(a==="impcancelar"){ IMP.items=[]; IMP.estado=""; clearTimeout(refresh._t); renderAll(); }
  else if(a==="impcrear"){
    const nuevos=IMP.items.filter(r=>r.sel).map(r=>mapearItem(r.it));
    if(!nuevos.length){ msgBox("impMsg2","w","No has marcado ninguna partida."); return; }
    S.huecos=S.huecos.concat(nuevos);
    S.sel=nuevos[0].id; IMP.items=[]; IMP.estado=""; S.tab="obra";
    clearTimeout(refresh._t); renderAll(); window.scrollTo({top:0});
  }
  else if(a==="dellogo"){ S.empresa[act.dataset.slot]=null; clearTimeout(refresh._t); renderAll(); }
  else if(a==="add"||a==="new"){ const n=nuevoHueco("Hueco "+(S.huecos.length+1)); S.huecos.push(n); S.sel=n.id; S.tab="medidas"; clearTimeout(refresh._t); renderAll(); window.scrollTo({top:0}); }
  else if(a==="dup"){ const n=JSON.parse(JSON.stringify(h)); n.id=uid(); n.nombre=h.nombre+" (copia)"; delete n.ejemplo; n.tareas={}; S.huecos.push(n); S.sel=n.id; clearTimeout(refresh._t); renderAll(); }
  else if(a==="del"){ if(act.dataset.sure){ S.huecos=S.huecos.filter(x=>x.id!==h.id); S.sel=S.huecos[0].id; clearTimeout(refresh._t); renderAll(); }
    else { act.dataset.sure="1"; act.textContent="Pulsa otra vez para eliminar"; setTimeout(()=>{ if(act.isConnected){ delete act.dataset.sure; act.textContent="Eliminar"; } },4000); } }
  else if(a==="copy"||a==="copyjson"){
    const txt = a==="copy"?textoPedido():JSON.stringify(S);
    const msg=$("#copyMsg");
    const ok=()=>{ msg.innerHTML='<div class="note o"><span class="ic">OK</span><span>Copiado al portapapeles.</span></div>'; setTimeout(()=>{if(msg)msg.innerHTML="";},3000); };
    const fail=()=>{ const pre=$("#outPedido"); if(a==="copy"&&pre){ const r=document.createRange(); r.selectNodeContents(pre); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }
      msg.innerHTML='<div class="note w"><span class="ic">!</span><span>El navegador no deja copiar solo. El texto queda seleccionado: cópialo a mano.</span></div>'; };
    try{ navigator.clipboard.writeText(txt).then(ok,fail); }catch(err){ fail(); }
  }
  else if(a==="import"){
    const ta=$("#imp"), msg=$("#impMsg");
    try{ const d=JSON.parse(ta.value); if(!d.huecos||!d.huecos.length) throw new Error("sin huecos");
      S=d; S.tarifa=Object.assign(JSON.parse(JSON.stringify(TARIFA_DEF)),S.tarifa||{});
      S.empresa=Object.assign(JSON.parse(JSON.stringify(EMPRESA_DEF)),S.empresa||{});
      S.sel=S.huecos[0].id; S.tab="obra"; renderAll(); }
    catch(err){ msg.innerHTML='<div class="note d"><span class="ic">!!</span><span>Ese texto no es una copia de seguridad válida. Pega el bloque completo, desde la primera llave hasta la última.</span></div>'; }
  }
  else if(a==="reset"){
    if(act.dataset.sure){ S=seed(); S.obra={nombre:"Obra nueva",cliente:"",tel:"",email:"",fecha:new Date().toISOString().slice(0,10),medidor:"",notas:""};
      S.huecos=[nuevoHueco("Hueco 1")]; S.sel=S.huecos[0].id; S.tab="obra"; renderAll(); }
    else { act.dataset.sure="1"; act.textContent="Se borrará todo. Pulsa otra vez"; setTimeout(()=>{ if(act.isConnected){ delete act.dataset.sure; act.textContent="Empezar obra nueva"; } },4000); }
  }
});
let PASTE_SLOT=null;
document.addEventListener("paste",e=>{
  const items=(e.clipboardData&&e.clipboardData.items)||[];
  for(let i=0;i<items.length;i++){
    if(items[i].type&&items[i].type.indexOf("image/")===0){
      const f=items[i].getAsFile();
      if(f){ e.preventDefault(); cargarLogo(f,PASTE_SLOT||"logo"); return; }
    }
  }
});
document.addEventListener("dragover",e=>{
  const z=e.target&&e.target.closest?e.target.closest("#dropPdf, .logobox"):null;
  if(!z) return;
  e.preventDefault(); z.classList.add("over");
});
document.addEventListener("dragleave",e=>{
  const z=e.target&&e.target.closest?e.target.closest("#dropPdf, .logobox"):null;
  if(z) z.classList.remove("over");
});
document.addEventListener("drop",e=>{
  const z=e.target&&e.target.closest?e.target.closest("#dropPdf, .logobox"):null;
  if(!z) return;
  e.preventDefault(); z.classList.remove("over");
  const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
  if(!f) return;
  if(z.id==="dropPdf") cargarPDFProveedor(f);
  else { const inp=z.querySelector("input[data-logo]"); if(inp) cargarLogo(f,inp.dataset.logo); }
});
$("#btnNew").addEventListener("click",()=>{ const n=nuevoHueco("Hueco "+(S.huecos.length+1)); S.huecos.push(n); S.sel=n.id; S.tab="medidas"; clearTimeout(refresh._t); renderAll(); window.scrollTo({top:0}); });
$("#btnTheme").addEventListener("click",()=>{
  const r=document.documentElement, cur=r.getAttribute("data-theme");
  const dark=cur? cur==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.setAttribute("data-theme", dark?"light":"dark");
  try{ localStorage.setItem(KEY+"-theme", dark?"light":"dark"); }catch(e){}
});
try{ const th=localStorage.getItem(KEY+"-theme"); if(th) document.documentElement.setAttribute("data-theme",th); }catch(e){}
renderAll();
</script>

  });
